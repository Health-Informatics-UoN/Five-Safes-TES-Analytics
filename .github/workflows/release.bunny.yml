# This workflow builds and publishes a Bunny CLI wrapper image for Five Safes TES.
# It runs nightly and builds the wrapper on:
#
# - The latest Bunny release, tagged with the Bunny version (e.g. `1.9.9`),
#   if that tag has not already been published.
# - Each open hutch-bunny pull request that has a published image, so unreleased
#   Bunny changes can be tested in TES. These are tagged `bunny-pr-<number>` (moves
#   to the newest build of that pull request) and `bunny-sha-<commit>` (fixed).
#   The `bunny-` prefix keeps them separate from this repository's own pull request tags.
#   A pull request is rebuilt only when it has a new commit.
#
# Because this wrapper tracks Bunny versions, the repository does not maintain an
# independent semantic versioning lifecycle for this image.
name: Publish a Bunny CLI image compatible with Five Safes TES.

on:
  schedule:
    - cron: "0 0 * * *"
env:
  image-name: five-safes-tes-analytics-bunny-cli
  registry: ghcr.io
  bunny-repo: health-informatics-uon/hutch-bunny
  bunny-image: ghcr.io/health-informatics-uon/hutch/bunny

jobs:
  publish-analytics-bunny:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Docker Login
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish new Bunny release and pull request images
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_NAME: ${{ env.image-name }}
          REGISTRY: ${{ env.registry }}
          BUNNY_REPO: ${{ env.bunny-repo }}
          BUNNY_IMAGE: ${{ env.bunny-image }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          failed=()

          exists() { docker manifest inspect "$1" >/dev/null 2>&1; }

          # build <Bunny image tag> <tag to publish>...
          build() {
            local base=$1; shift
            local tags=()
            for t in "$@"; do tags+=(--tag "${image}:${t}"); done
            echo "::group::Building on Bunny ${base} as: $*"
            if [ -n "${DRY_RUN:-}" ]; then
              echo "[dry run] skipping build"
            elif ! docker buildx build ./docker/bunny-wrapper \
                --push \
                --platform linux/amd64,linux/arm64 \
                --build-arg "BUNNY_VERSION=${base}" \
                --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
                --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
                --label "org.opencontainers.image.version=${base}" \
                --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --annotation "index,manifest:org.opencontainers.image.description=Five Safes TES Analytics Bunny CLI" \
                "${tags[@]}"; then
              failed+=("${base}")
            fi
            echo "::endgroup::"
          }

          # Latest Bunny release
          release=$(gh api "repos/${BUNNY_REPO}/releases/latest" --jq '.tag_name | ltrimstr("v")')
          if exists "${image}:${release}"; then
            echo "Release ${release}: already published"
          else
            build "${release}" "${release}"
          fi

          # Open Bunny pull requests. Only those from branches in the Bunny repository have
          # published images, tagged sha-<7-character commit> by Bunny's pull request workflow.
          prs=$(gh api --paginate "repos/${BUNNY_REPO}/pulls?state=open&per_page=100" \
                  --jq '.[] | select(.head.repo.full_name == .base.repo.full_name) | "\(.number) \(.head.sha)"')
          while read -r number sha; do
            [ -n "${number}" ] || continue
            short=${sha:0:7}
            if ! exists "${BUNNY_IMAGE}:sha-${short}"; then
              echo "Bunny PR #${number} (${short}): no Bunny image yet, skipping"
            elif exists "${image}:bunny-sha-${short}"; then
              echo "Bunny PR #${number} (${short}): already published"
            else
              build "sha-${short}" "bunny-pr-${number}" "bunny-sha-${short}"
            fi
          done <<< "${prs}"

          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Failed to build on Bunny: ${failed[*]}"
            exit 1
          fi
