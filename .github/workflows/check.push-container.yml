# Builds this repository's container images for every pull request.
# - Analytics: only checks the image builds (`publish: false`).
# - Bunny CLI: for pull requests from branches in this repo, also publishes the image tagged
#   `pr-<number>`, `sha-<commit>` and `tree-<hash>`, so it can be tested in TES before it is merged.
#   Pull requests from forks and Dependabot only check the image builds.
# Release images are published by `release.yml` (analytics, on merge to main)
# and `release.bunny.yml` (Bunny CLI, nightly).

name: Check and Push Containers

on:
  pull_request:

# A new push to the pull request cancels the build of the previous one
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-analytics:
    name: Build Analytics Container
    permissions:
      contents: read
      packages: write
    uses: health-informatics-uon/workflows/.github/workflows/publish-pr-container.yml@1.8.2
    with:
      image-name: five-safes-tes-analytics
      image-description: "Five Safes TES Analytics (pull request build)"
      registry: ghcr.io
      context: .
      dockerfile: docker/analytics-dev/Dockerfile
      platforms: linux/amd64,linux/arm64
      publish: false
    secrets: inherit

  publish-bunny-cli:
    name: Build Bunny CLI Container
    permissions:
      contents: read
      packages: write
    uses: health-informatics-uon/workflows/.github/workflows/publish-pr-container.yml@1.8.2
    with:
      image-name: five-safes-tes-analytics-bunny-cli
      image-description: "Five Safes TES Analytics Bunny CLI (pull request build)"
      registry: ghcr.io
      context: ./docker/bunny-wrapper
      dockerfile: docker/bunny-wrapper/Dockerfile
      platforms: linux/amd64,linux/arm64
    secrets: inherit
